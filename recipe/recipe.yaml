# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  name: ydata-profiling
  version: "4.17.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/ydata-profiling-${{ version }}.tar.gz
  sha256: 6ead76a9bffe170a6fcb6195248cd5110bdfc7971af9257c0e6716b4f1e65815

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - ydata_profiling = ydata_profiling.controller.console:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=72.0.0,<80.0.0
    - setuptools-scm >=8.0.0,<9.0.0
    - wheel >=0.38.4,<1.0.0
    - pip
  run:
    - python >=${{ python_min }},<4.0,<3.14
    - scipy >=1.4.1,<1.16
    - pandas >1.1,<3.0,!=1.4.0
    - matplotlib-base >=3.5,<=3.10
    - pydantic >=2
    - pyyaml >=5.0.0,<6.1
    - jinja2 >=2.11.1,<3.2
    - visions >=0.7.5,<0.8.2
    - numpy >=1.16.0,<2.2
    - minify-html >=0.15.0
    - filetype >=1.0.0
    - phik >=0.11.1,<0.13
    - requests >=2.24.0,<3
    - tqdm >=4.48.2,<5
    - seaborn-base >=0.10.1,<0.14
    - multimethod >=1.4,<2
    - statsmodels >=0.13.2,<1
    - typeguard >=3,<5
    - imagehash ==4.3.1
    - wordcloud >=1.9.3
    - dacite >=1.8
    - numba >=0.56.0,<=0.61
    - ipython <9.0
  run_constraints:
    - jupyter-client >=5.3.4
    - jupyter-core >=4.6.3
    - ipywidgets >=7.5.1
    - tangled-up-in-unicode ==0.2.0

tests:
  - python:
      imports:
        - ydata_profiling
      pip_check: true
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check
      - ydata_profiling --help

about:
  summary: Generate profile report for pandas DataFrame
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/ydataai/ydata-profiling
  documentation: https://ydata-profiling.ydata.ai

extra:
  recipe-maintainers:
    - rxm7706
